<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おてつだい">
<meta name="theme-color" content="#ffffff">
<title>おてつだい ちょきん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E3%83%9E&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;     /* 紙 */
    --ink:#1f2a44;       /* 紺のインク */
    --sub:#5b6475;
    --rule:#cfdaeb;      /* ノートの罫線 */
    --shu:#d23a2e;       /* 朱肉 */
    --fusen:#ffe76a;     /* 付箋 */
    --fusen-nori:#f2cf2e;
    --mist:#eef2f7;
    --kc:#1f2a44; --kdk:#141c2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:16px;line-height:1.6}
  body{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  /* パソコンで開いたときもスマホくらいの幅で真ん中に */
  @media (min-width:600px){body{max-width:480px;margin:0 auto;min-height:100vh;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  input{font:inherit;font-size:16px;color:var(--ink)}
  :focus-visible{outline:3px solid var(--kc);outline-offset:2px}
  .kid,.sheet.kid{word-break:keep-all;overflow-wrap:anywhere}
  .num{font-family:"BIZ UDGothic","BIZ UDPGothic",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}

  /* 試作だけの切り替え（本番では出さない） */
  .proto{position:sticky;top:0;z-index:20;background:var(--mist);border-bottom:1px solid var(--rule);
    padding:calc(6px + env(safe-area-inset-top)) 12px 6px;font-size:12px;color:var(--sub)}
  .proto .row{display:flex;align-items:center;gap:4px}
  .proto .seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-left:6px}
  .proto button{white-space:nowrap}
  @media (max-width:380px){.proto .lbl{display:none}}
  .proto .seg button{color:var(--ink);padding:5px 10px;font-weight:700;font-size:13px;background:#fff}
  .proto .seg button+button{border-left:1.5px solid var(--ink)}
  .proto .seg button.on{background:var(--ink);color:#fff}
  .proto #reset{margin-left:auto;font-size:12px;color:var(--sub);text-decoration:underline;padding:6px 2px}

  /* ===== 子ども：通帳の表紙（いまのちょきん） ===== */
  .cover{background:var(--kc);color:#fff;padding:18px 20px 20px}
  .cover .who{font-size:15px;font-weight:700;opacity:.92}
  .cover .amt{font-size:56px;line-height:1.05;margin:2px 0 14px;letter-spacing:-.01em}
  .cover .amt small{font-size:24px;margin-left:4px;font-family:"BIZ UDPGothic",sans-serif}
  .cover .wait{font-size:14px;margin:-8px 0 12px;opacity:.92}
  .wbtn{display:block;width:100%;padding:13px;border-radius:10px;background:#fff;color:var(--kc);font-weight:700;font-size:17px;
    border-bottom:4px solid rgba(0,0,0,.28)}
  .wbtn:active{transform:translateY(3px);border-bottom-width:1px}
  .wbtn:disabled{opacity:.7;transform:none;border-bottom-width:4px}

  /* ===== 子ども：おさいふ（手元のお金）。表紙のすぐ下 ===== */
  .saifu{padding:14px 20px 16px;border-bottom:1.5px solid var(--ink)}
  .saifu .top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .saifu .lb{font-size:17px;font-weight:700;color:var(--kc)}
  .saifu .lb small{display:block;font-size:12px;font-weight:400;color:var(--sub);line-height:1.3}
  .saifu .amt{margin-left:auto;font-size:32px;line-height:1.1;color:var(--kc)}
  .saifu .amt small{font-size:17px;margin-left:2px;font-family:"BIZ UDPGothic",sans-serif}
  .saifu .bt{display:flex;gap:8px}
  .sfb{flex:1;padding:11px 6px;border-radius:10px;border:2px solid var(--kc);border-bottom-width:4px;color:var(--kc);background:#fff;font-weight:700;font-size:16px}
  .sfb:active{transform:translateY(2px);border-bottom-width:2px}
  .sfb small{font-size:12px;font-weight:400;margin-left:2px}
  /* おさいふの きろく：最後の列は ママのハンコ か 「けす」 */
  .bk .s .del{width:100%;min-height:44px;padding:0;white-space:nowrap;font-size:12px;color:var(--sub);text-decoration:underline}
  .bk .w .cat{font-weight:700}
  /* つかった・もらった を書く */
  .cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 18px}
  .cats button{padding:12px 2px;border:2px solid var(--rule);border-radius:10px;font-weight:700;font-size:15px;background:#fff}
  .cats button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .memo{display:block;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;font-size:18px;margin:0 0 6px}
  .sheet .lead.warn{color:var(--shu);font-weight:700}

  .blk{padding:22px 20px 0}
  h2{font-size:17px;margin:0 0 4px;font-weight:700}
  .note{margin:0 0 10px;font-size:14px;color:var(--sub)}

  /* ママからのおねがい＝付箋 */
  .fusen{position:relative;background:var(--fusen);border-top:10px solid var(--fusen-nori);padding:12px 14px 14px;margin:0 0 10px;
    display:flex;align-items:center;gap:12px}
  .fusen .tx{flex:1;min-width:0}
  .fusen .to{font-size:13px;font-weight:700}
  .fusen .nm{font-size:19px;font-weight:700;line-height:1.35}
  .fusen .yen{font-size:15px}
  .go{flex:none;min-width:92px;padding:12px 12px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;border-bottom:4px solid #000}
  .go:active{transform:translateY(3px);border-bottom-width:1px}

  /* おてつだい一覧（罫線で区切る） */
  .list{border-top:1.5px solid var(--rule)}
  .chore{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;min-height:62px;border-bottom:1.5px solid var(--rule)}
  .chore .nm{flex:1;font-size:18px;font-weight:700;line-height:1.35}
  .chore .yen{flex:none;font-size:18px}
  .chore .yen small{font-size:13px;font-family:"BIZ UDPGothic",sans-serif;margin-left:1px}
  .chore .btn{flex:none;padding:8px 12px;border-radius:8px;border:2px solid var(--kc);color:var(--kc);font-weight:700;font-size:15px;border-bottom-width:4px}
  .chore:active .btn{transform:translateY(2px);border-bottom-width:2px}

  /* OKまち */
  .wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--rule)}
  .wrow .tx{flex:1;min-width:0}
  .wrow .nm{font-weight:700;font-size:16px}
  .wrow .sub{display:block;font-size:13px;color:var(--sub)}
  .wrow .yen{flex:none}
  .wrow.redo .sub{color:var(--shu);font-weight:700}
  .link{flex:none;font-size:14px;color:var(--sub);text-decoration:underline;padding:8px 2px}
  .again{flex:none;padding:9px 10px;border-radius:8px;background:var(--shu);color:#fff;font-weight:700;font-size:14px;border-bottom:3px solid #8f2119}

  /* 通帳（おかねの きろく） */
  .book{border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
  .bk{display:grid;grid-template-columns:50px minmax(0,1fr) 58px 58px 34px;align-items:stretch;border-top:1px solid var(--rule)}
  .bk>*{padding:9px 4px;min-height:44px;display:flex;align-items:center}
  .bk>*+*{border-left:1px solid var(--rule)}
  .bk .d{font-size:12px;justify-content:center;color:var(--sub)}
  .bk .w{font-size:14px;line-height:1.4;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:8px}
  .bk .w .tip{display:block;font-size:12px;color:var(--sub)}
  .bk .m,.bk .z{justify-content:flex-end;font-size:15px;padding-right:6px}
  .bk .m.minus{color:var(--shu)}
  .bk .s{justify-content:center;padding:4px 0}
  .bk.head{background:var(--mist);border-top:0}
  .bk.head>*{min-height:30px;padding:4px;font-size:12px;color:var(--sub);font-weight:700;justify-content:center}
  .bk.off .w,.bk.off .m{color:var(--sub)}
  .bk.last .z{background:#fff8c9}

  /* ママのハンコ */
  .hanko{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:2px solid var(--shu);border-radius:50%;
    color:var(--shu);font-family:"Yuji Syuku","Hiragino Mincho ProN",serif;font-size:11px;line-height:1;writing-mode:vertical-rl;
    letter-spacing:-1px;transform:rotate(-12deg);opacity:.88}

  /* ===== ママの画面 ===== */
  .mhead{display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1.5px solid var(--ink)}
  .mhead h1{flex:1;margin:0;font-size:21px}
  .mhead .cnt{font-size:16px;font-weight:700}
  .zan{border:1.5px solid var(--ink);border-radius:4px}
  .zr{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--rule)}
  .zr:first-child{border-top:0}
  .zr .kn{flex:1;font-weight:700;font-size:16px;color:var(--kc);display:flex;align-items:center;gap:8px}
  .zr .kn::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--kc)}
  .zr .num{font-size:22px}
  .zr .num small{font-size:14px;font-family:"BIZ UDPGothic",sans-serif;margin-left:2px}

  .pend{position:relative;padding:14px 0 14px 14px;border-bottom:1.5px solid var(--rule);border-left:6px solid var(--kc);padding-left:12px;margin-left:-2px}
  .pend:first-of-type{border-top:1.5px solid var(--rule)}
  .pend .ph{display:flex;align-items:baseline;gap:8px;font-size:14px}
  .pend .ph b{color:var(--kc);font-size:15px}
  .pend .ph .when{margin-left:auto;color:var(--sub);font-size:13px}
  .pend .pw{font-size:19px;font-weight:700;margin:2px 0 10px;line-height:1.4}
  .pend .pw .num{margin-left:6px}
  .pend .from{display:inline-block;font-size:12px;font-weight:700;background:var(--fusen);border-top:3px solid var(--fusen-nori);padding:0 6px;margin-left:6px;vertical-align:3px}
  .pend .calc{font-size:14px;color:var(--sub);margin:-6px 0 10px}
  .tiprow{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px;font-weight:700}
  .tiprow input{width:100px;padding:9px 10px;border:1.5px solid var(--sub);border-radius:8px;text-align:right;font-weight:700}
  .tiprow small{font-weight:400;color:var(--sub);font-size:13px}
  .pb{display:flex;gap:8px}
  .pb button{padding:12px 10px;border-radius:10px;font-weight:700;font-size:16px}
  .pb .no{flex:none;width:32%;border:2px solid var(--rule);color:var(--sub);background:#fff}
  .pb .ok{flex:1;background:var(--ink);color:#fff;border-bottom:4px solid #000}
  .pb .ok:active{transform:translateY(3px);border-bottom-width:1px}
  .pb .ok:disabled{background:#aab3c2;border-bottom-color:#8e97a6;transform:none}
  .pend .hanko.big{position:absolute;right:12px;top:34px;width:76px;height:76px;font-size:28px;border-width:3px;letter-spacing:-3px;pointer-events:none}
  .pend.stamped .pb{opacity:.35}
  @keyframes oshite{0%{transform:scale(1.8) rotate(-12deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:.95}100%{transform:scale(1) rotate(-12deg);opacity:.88}}
  .pend .hanko.big{animation:oshite .32s ease-out both}
  @media (prefers-reduced-motion:reduce){.pend .hanko.big{animation:none}}

  .ask{display:block;width:100%;padding:13px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:10px;background:#fff;font-weight:700;font-size:17px;margin:0 0 12px}
  .ask:active{transform:translateY(2px);border-bottom-width:2px}
  .ktag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--kc);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
  .none{padding:14px 0;color:var(--sub);font-size:15px;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}

  details{border-top:1.5px solid var(--ink);margin:26px 20px 0}
  details+details{margin-top:0}
  details:last-of-type{border-bottom:1.5px solid var(--ink)}
  details summary{padding:15px 0;font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"ひらく";margin-left:auto;font-size:13px;color:var(--sub);font-weight:400}
  details[open] summary::after{content:"とじる"}
  details .in{padding:0 0 16px}
  .erow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .erow input{min-width:0;padding:10px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
  .erow .en{flex:1}
  .erow .ey{width:76px;text-align:right}
  .erow .yl{font-size:14px;color:var(--sub)}
  .xbtn{flex:none;font-size:14px;color:var(--shu);text-decoration:underline;padding:8px 4px}
  .addbtn{width:100%;padding:11px;border:1.5px dashed var(--sub);border-radius:8px;color:var(--ink);font-weight:700}
  .hrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .hrow .tx{flex:1;min-width:0}
  .hrow .sub{display:block;font-size:12px;color:var(--sub)}
  .hrow .m.minus{color:var(--shu)}
  .hrow .off{color:var(--sub);font-size:13px}
  /* 付箋：やったよ＋とりけす */
  .fusen .ut{display:inline-flex;align-items:center;min-height:44px;margin-top:2px;padding:0 2px;font-size:14px;color:var(--ink);text-decoration:underline}
  /* 子どもの名前 */
  .nrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .nrow .sw{flex:none;width:14px;height:14px;border-radius:3px;background:var(--kc)}
  .nrow input{flex:1;min-width:0;padding:10px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;font-weight:700}
  /* 月ごとの集計 */
  .mnav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .mnav b{flex:1;text-align:center;font-size:18px}
  .mnav button{flex:none;padding:8px 12px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;font-weight:700;font-size:14px;background:#fff}
  .mnav button:disabled{border-color:var(--rule);color:#aab3c2}
  .sum{border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
  .sr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;border-top:1px solid var(--rule)}
  .sr:first-child{border-top:0}
  .sr>*{padding:8px;min-height:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
  .sr>*+*{border-left:1px solid var(--rule)}
  .sr>.kn+*{border-left:0}
  .sr .kn{grid-column:1/-1;min-height:0;padding:10px 8px 0;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;font-weight:700;color:var(--kc);overflow-wrap:anywhere}
  .sr .kn::before{content:"";flex:none;width:12px;height:12px;border-radius:2px;background:var(--kc)}
  .sr .num{font-size:16px;white-space:nowrap}
  .sr small{font-size:11px;color:var(--sub);font-weight:400;font-family:"BIZ UDPGothic",sans-serif;text-align:right}
  .sr.head{background:var(--mist)}
  .sr.head>*{min-height:32px;padding:4px 6px;font-size:12px;color:var(--sub);font-weight:700;align-items:center}
  .sr .minus{color:var(--shu)}
  /* おさいふ（ママの画面）：のこりと月ごとの使いみち */
  .blk h3{font-size:15px;margin:18px 0 8px}
  .sk{border-top:1.5px solid var(--rule);padding:12px 0 6px}
  .sk:last-child{border-bottom:1.5px solid var(--rule)}
  .sk .skh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
  .sk .kn{flex:1;font-weight:700;color:var(--kc);display:flex;align-items:center;gap:8px}
  .sk .kn::before{content:"";flex:none;width:12px;height:12px;border-radius:2px;background:var(--kc)}
  .sk .io{font-size:13px;color:var(--sub)}
  .sk .io b{font-size:15px;color:var(--ink)}
  .sk .io b.minus{color:var(--shu)}
  .bar{display:grid;grid-template-columns:78px minmax(0,1fr) 70px;align-items:center;gap:8px;min-height:28px;font-size:14px}
  .bar .bt{height:12px;background:var(--mist);border-radius:2px;overflow:hidden}
  .bar .bt i{display:block;height:100%;background:var(--kc)}
  .bar .num{text-align:right}
  .sk .hrow:last-child{border-bottom:0}
  .sk .zero{font-size:14px;color:var(--sub);margin:0 0 6px}

  /* 下から出る画面 */
  .sbg{position:fixed;inset:0;background:rgba(31,42,68,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .sbg.show{display:flex}
  .sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 2px;font-size:21px;line-height:1.35}
  .sheet .lead{margin:0 0 16px;color:var(--sub);font-size:15px}
  .sheet .lead b{color:var(--ink)}
  .sbtn{display:block;width:100%;padding:15px;border-radius:10px;font-weight:700;font-size:17px;margin-top:10px}
  .sbtn.main{background:var(--ink);color:#fff;border-bottom:4px solid #000}
  .sbtn.main:disabled{background:#aab3c2;border-bottom-color:#8e97a6}
  .sbtn.sub{border:2px solid var(--rule);color:var(--sub)}
  .pick{border-top:1.5px solid var(--rule);margin-bottom:18px}
  .pick button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1.5px solid var(--rule);font-size:16px}
  .pick button .y{margin-left:auto}
  .pick button .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);flex:none}
  .pick button.on{background:#fffbe0}
  .pick button.on .dot{border:7px solid var(--ink)}
  .pick button small{display:block;font-size:13px;color:var(--sub)}
  .sl{display:block;font-size:15px;font-weight:700;margin:0 0 6px}
  .amtrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .amtrow input{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;font-size:28px;font-weight:700;text-align:right;
    font-family:"BIZ UDGothic",sans-serif}
  .amtrow span{font-size:20px;font-weight:700}
  .amtrow button{flex:none;padding:14px 12px;border-radius:10px;border:2px solid var(--rule);font-weight:700}
  .err{color:var(--shu);font-size:15px;font-weight:700;min-height:24px;margin:0}
  .scalc{font-size:17px;font-weight:700;color:var(--ink);min-height:24px;margin:4px 0 4px}

  .toast{word-break:keep-all;overflow-wrap:anywhere;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* 合言葉なし・読み込み中 */
  .nokey{padding:48px 24px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
  .nokey h1{font-size:22px;margin:0 0 16px}
  .nokey p{font-size:17px;margin:0 0 14px}
  .nokey .note{font-size:14px;color:var(--sub)}
  .nokey a{color:var(--ink);font-weight:700}
  /* スマホで開くURL */
  .urow{border-top:1.5px solid var(--rule);padding:14px 0}
  .urow b{display:block;font-size:16px;color:var(--kc);margin-bottom:8px}
  .qr{width:180px;max-width:60%;margin:0 0 10px;font-size:13px;color:var(--sub)}
  .qr svg{display:block;width:100%;height:auto}

<script>
/* ==== CORE:START（src/core.js を build.py が書き写す。ここは直接直さない） ==== */
/* おてつだい ちょきん：きまり（ルール）
 * アプリ（試作のダミー）と GAS（本番）の両方で、この同じファイルを使う。
 * build.py が index.html と gas/Code.gs に書き写すので、直すのはここだけ。
 * GAS でも動くように、?? や ?. は使わない。
 *
 * st（全部のデータ）の形
 *   names:    {k1:'上の子', k2:'下の子'}
 *   chores:   [{id, name, yen, deleted}]
 *   records:  [{id, kid, type:'chore'|'withdraw', name, yen, tip, status, at, doneAt, qid, req}]
 *             前借り＝type:'withdraw'・name:'まえがり'・最初から approved（ママだけが書く。ちょきんがマイナスになってもよい）
 *             status: pending（OK待ち）/ approved（OK・渡した）/ redo（やり直し）/ rejected（引き出しをやめた）/ cancelled（子どもが取り消した／ママが消した前借り）
 *   requests: [{id, name, yen, mode:'shimei'|'hayai', to, status, at}]
 *             status: open / taken（早い者勝ちで「やる！」が押された）/ submitted（やったよ）/ done / cancelled
 *   wallet:   [{id, kid, type:'in'|'out', cat, memo, yen, at, deleted}]   おさいふ（手元のお金）。子どもが自分で書く
 *             in＝もらった（お年玉など）/ out＝つかった。ママが「渡した」引き出しは records から数える（ここには書かない）
 * 書きかえた物には _dirty、新しく足した物には _new の印をつける（GAS はこの印を見てシートに書く）
 */
var CORE = (function () {
  var MAX_YEN = 100000;          // 1回の金額・チップ・引き出しの上限
  var NAME_MAX = 10;             // 子どもの呼び名
  var CHORE_MAX = 20;            // お手伝いの名前
  var MEMO_MAX = 20;             // おさいふの「ひとこと」
  var CATS = ['おかし', 'おもちゃ', 'ほん', 'あそび', 'プレゼント', 'そのほか'];   // つかった ときの使いみち
  var KIDS = ['k1', 'k2'];
  var MAEGARI = 'まえがり';      // 前借りの記録の印（記録の name に入れる）

  // 全角の数字も読む。数字以外がまざっていたら bad
  function toInt(v) {
    var t = String(v == null ? '' : v).trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[,，円]/g, '');
    if (t === '') return { n: 0, empty: true };
    if (!/^[0-9]+$/.test(t)) return { n: 0, bad: true };
    return { n: parseInt(t, 10) };
  }
  // 文字の掃除：制御文字を消して前後の空白を取り、max 文字で切る
  function cleanText(s, max) {
    var t = String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').trim().replace(/^'+/, '').trim();   // 先頭の ' はシートが消すので最初から取る
    return Array.from(t).slice(0, max).join('');
  }
  function balance(st, kid) {
    return st.records.filter(function (r) { return r.kid === kid && r.status === 'approved'; })
      .reduce(function (s, r) { return s + (r.type === 'withdraw' ? -r.yen : r.yen + (r.tip || 0)); }, 0);
  }
  function waitingWithdraw(st, kid) {
    return st.records.filter(function (r) { return r.kid === kid && r.type === 'withdraw' && r.status === 'pending'; })
      .reduce(function (s, r) { return s + r.yen; }, 0);
  }
  // おさいふの のこり＝ママが渡した引き出し＋もらった−つかった
  function walletBalance(st, kid) {
    var got = st.records.filter(function (r) { return r.kid === kid && r.type === 'withdraw' && r.status === 'approved'; })
      .reduce(function (s, r) { return s + r.yen; }, 0);
    return (st.wallet || []).filter(function (w) { return w.kid === kid && !w.deleted; })
      .reduce(function (s, w) { return s + (w.type === 'out' ? -w.yen : w.yen); }, got);
  }
  // おさいふの きろくを古い順に足したときの、途中の いちばん少ない のこり（0より上なら0）。skip のIDの1件は数えない
  // 前の日の「もらった」を消すと、最後の のこりはプラスでも途中がマイナスになることがあるので、消す前にこれで確かめる
  function walletLowest(st, kid, skip) {
    var rows = st.records.filter(function (r) { return r.kid === kid && r.type === 'withdraw' && r.status === 'approved' && r.id !== skip; })
      .map(function (r) { return { at: r.doneAt || r.at, v: r.yen }; })
      .concat((st.wallet || []).filter(function (w) { return w.kid === kid && !w.deleted && w.id !== skip; })
        .map(function (w) { return { at: w.at, v: w.type === 'out' ? -w.yen : w.yen }; }));
    rows.sort(function (a, b) { return a.at - b.at; });
    var run = 0, low = 0;
    rows.forEach(function (x) { run += x.v; if (run < low) low = run; });
    return low;
  }
  // その「もらった」を消すと、おさいふの きろくの どこかで のこりがマイナスになる（今より悪くなる）か
  function walletDelBreaks(st, kid, w) {
    return w.type === 'in' && walletLowest(st, kid, w.id) < walletLowest(st, kid, null);
  }
  // その前借りを消すと、おさいふの きろくの どこかで のこりがマイナスになる（今より悪くなる）か
  function maegariDelBreaks(st, r) {
    return walletLowest(st, r.kid, r.id) < walletLowest(st, r.kid, null);
  }
  function fail(code, extra) {
    var e = new Error(code);
    e.code = code;
    e.extra = extra || null;
    throw e;
  }

  // 1つの操作をする。だめなら fail(理由) で止める（データはそのまま）
  function apply(st, role, a, p, now, newId) {
    p = p || {};
    var isKid = KIDS.indexOf(role) >= 0;
    var isMama = role === 'mama';
    function kidOnly() { if (!isKid) fail('perm'); }
    function mamaOnly() { if (!isMama) fail('perm'); }
    function rec(id) { return st.records.filter(function (r) { return r.id === String(id); })[0]; }
    function req(id) { return st.requests.filter(function (q) { return q.id === String(id); })[0]; }
    function chore(id) { return st.chores.filter(function (c) { return c.id === String(id) && !c.deleted; })[0]; }
    function touch(o) { o._dirty = true; return o; }
    function add(list, o) { o._new = true; list.push(o); return o; }
    var r, q, c, t;

    switch (a) {
      case 'load':
        return {};

      /* ----- 子ども ----- */
      case 'done':          // お手伝い一覧から「やったよ」
        kidOnly();
        c = chore(p.cid); if (!c) fail('gone');
        add(st.records, { id: newId(), kid: role, type: 'chore', name: c.name, yen: c.yen, tip: 0, status: 'pending', at: now, doneAt: null, qid: '', req: false });
        return {};
      case 'withdraw':      // 引き出したい
        kidOnly();
        t = toInt(p.yen);
        if (t.bad || t.empty || t.n <= 0 || t.n > MAX_YEN) fail('input');
        var can = balance(st, role) - waitingWithdraw(st, role);
        if (t.n > can) fail('balance', { can: can });
        add(st.records, { id: newId(), kid: role, type: 'withdraw', name: '', yen: t.n, tip: 0, status: 'pending', at: now, doneAt: null, qid: '', req: false });
        return {};
      case 'take':          // 早い者勝ちの「やる！」
        kidOnly();
        q = req(p.qid);
        if (!q || q.mode !== 'hayai' || q.status === 'cancelled' || q.status === 'done') fail('gone');
        if (q.status !== 'open') fail(q.to === role ? 'gone' : 'taken');
        q.status = 'taken'; q.to = role; touch(q);
        return {};
      case 'untake':        // 「やる！」の取り消し → 2人に出した状態に戻す
        kidOnly();
        q = req(p.qid);
        if (!q || q.status !== 'taken' || q.to !== role) fail('gone');
        q.status = 'open'; q.to = ''; touch(q);
        return {};
      case 'reqdone':       // 付箋の「やったよ」
        kidOnly();
        q = req(p.qid);
        var mine = q && ((q.status === 'open' && q.mode === 'shimei' && q.to === role) || (q.status === 'taken' && q.to === role));
        if (!mine) fail(q && q.status === 'taken' ? 'taken' : 'gone');
        q.status = 'submitted'; q.to = role; touch(q);
        add(st.records, { id: newId(), kid: role, type: 'chore', name: q.name, yen: q.yen, tip: 0, status: 'pending', at: now, doneAt: null, qid: q.id, req: true });
        return {};
      case 'again':         // やり直しのあと「もういちど やったよ」
        kidOnly();
        r = rec(p.rid);
        if (!r || r.kid !== role || r.status !== 'redo') fail('gone');
        r.status = 'pending'; r.at = now; touch(r);
        return {};
      case 'cancel':        // OKまちの「とりけす」
        kidOnly();
        r = rec(p.rid);
        if (!r || r.kid !== role || (r.status !== 'pending' && r.status !== 'redo')) fail('gone');
        r.status = 'cancelled'; touch(r);
        if (r.qid) {
          q = req(r.qid);
          if (q && q.status === 'submitted') { q.status = q.mode === 'hayai' ? 'taken' : 'open'; touch(q); }
        }
        return {};
      case 'saifu_in':      // おさいふ：もらった（お年玉・おばあちゃんから など）
      case 'saifu_out':     // おさいふ：つかった（のこりより多くは書けない）
        kidOnly();
        t = toInt(p.yen);
        if (t.bad || t.empty || t.n <= 0 || t.n > MAX_YEN) fail('input');
        var out = a === 'saifu_out';
        if (out && CATS.indexOf(String(p.cat)) < 0) fail('input');
        if (out && t.n > walletBalance(st, role)) fail('saifu', { can: walletBalance(st, role) });
        if (!st.wallet) st.wallet = [];
        add(st.wallet, { id: newId(), kid: role, type: out ? 'out' : 'in', cat: out ? String(p.cat) : '', memo: cleanText(p.memo, MEMO_MAX), yen: t.n, at: now, deleted: false });
        return {};
      case 'saifu_del':     // おさいふ：書きまちがいを消す（印をつけるだけ）
        kidOnly();
        var w = (st.wallet || []).filter(function (x) { return x.id === String(p.wid) && x.kid === role && !x.deleted; })[0];
        if (!w) fail('gone');
        if (walletDelBreaks(st, role, w)) fail('saifu_del');   // 消すと きろくの途中で のこりがマイナスになる
        w.deleted = true; touch(w);
        return {};

      /* ----- ママ ----- */
      case 'ok':            // OK（チップつき）
        mamaOnly();
        r = rec(p.rid);
        if (!r || r.type !== 'chore' || r.status !== 'pending') fail('gone');
        t = toInt(p.tip);
        if (t.bad || t.n > MAX_YEN) fail('input');
        r.status = 'approved'; r.tip = t.n; r.doneAt = now; touch(r);
        if (r.qid) { q = req(r.qid); if (q) { q.status = 'done'; touch(q); } }
        return {};
      case 'redo':          // やり直し
        mamaOnly();
        r = rec(p.rid);
        if (!r || r.type !== 'chore' || r.status !== 'pending') fail('gone');
        r.status = 'redo'; touch(r);
        return {};
      case 'wok':           // 引き出し：渡した
        mamaOnly();
        r = rec(p.rid);
        if (!r || r.type !== 'withdraw' || r.status !== 'pending') fail('gone');
        if (balance(st, r.kid) < r.yen) fail('balance', { can: balance(st, r.kid) });
        r.status = 'approved'; r.doneAt = now; touch(r);
        return {};
      case 'wno':           // 引き出し：やめる
        mamaOnly();
        r = rec(p.rid);
        if (!r || r.type !== 'withdraw' || r.status !== 'pending') fail('gone');
        r.status = 'rejected'; r.doneAt = now; touch(r);
        return {};
      case 'maegari':       // 前借り：ママが渡したお金を ちょきんから引く（マイナスになってもよい。次のお手伝いのぶんで戻る）
        mamaOnly();
        if (KIDS.indexOf(p.kid) < 0) fail('input');
        t = toInt(p.yen);
        if (t.bad || t.empty || t.n <= 0 || t.n > MAX_YEN) fail('input');
        add(st.records, { id: newId(), kid: p.kid, type: 'withdraw', name: MAEGARI, yen: t.n, tip: 0, status: 'approved', at: now, doneAt: now, qid: '', req: false });
        return {};
      case 'maegari_del':   // 前借りの書きまちがいを消す（印をつけるだけ）
        mamaOnly();
        r = rec(p.rid);
        if (!r || r.type !== 'withdraw' || r.status !== 'approved' || r.name !== MAEGARI) fail('gone');
        if (maegariDelBreaks(st, r)) fail('maegari_del');   // 消すと おさいふの きろくの途中で のこりがマイナスになる
        r.status = 'cancelled'; touch(r);
        return {};
      case 'ask':           // お願いを書く
        mamaOnly();
        c = chore(p.cid); if (!c) fail('gone');
        if (p.who !== 'k1' && p.who !== 'k2' && p.who !== 'both') fail('input');
        add(st.requests, { id: newId(), name: c.name, yen: c.yen, mode: p.who === 'both' ? 'hayai' : 'shimei', to: p.who === 'both' ? '' : p.who, status: 'open', at: now });
        return {};
      case 'reqcancel':     // お願いの取り消し
        mamaOnly();
        q = req(p.qid);
        if (!q || (q.status !== 'open' && q.status !== 'taken')) fail('gone');
        q.status = 'cancelled'; touch(q);
        return {};
      case 'chore_add':
        mamaOnly();
        var nm = cleanText(p.name, CHORE_MAX) || '新しいお手伝い';
        t = toInt(p.yen == null ? 10 : p.yen);
        if (t.bad || t.empty || t.n > MAX_YEN) fail('input');
        add(st.chores, { id: newId(), name: nm, yen: t.n, deleted: false });
        return {};
      case 'chore_edit':
        mamaOnly();
        c = chore(p.cid); if (!c) fail('gone');
        var n2 = c.name, y2 = c.yen;      // 両方確かめてから書きかえる（だめなら何も変えない）
        if (p.name != null) { n2 = cleanText(p.name, CHORE_MAX); if (!n2) fail('input'); }
        if (p.yen != null) { t = toInt(p.yen); if (t.bad || t.empty || t.n > MAX_YEN) fail('input'); y2 = t.n; }
        c.name = n2; c.yen = y2; touch(c);
        return {};
      case 'chore_del':     // 消しても過去の記録は残る（印をつけるだけ）
        mamaOnly();
        c = chore(p.cid); if (!c) fail('gone');
        c.deleted = true; touch(c);
        return {};
      case 'names':
        mamaOnly();
        var k1 = cleanText(p.k1, NAME_MAX), k2 = cleanText(p.k2, NAME_MAX);
        if (!k1 || !k2) fail('input');
        if (k1 === k2) fail('same');
        st.names = { k1: k1, k2: k2 }; st._namesDirty = true;
        return {};
    }
    fail('action');
  }

  // その人に見せてよい分だけを返す（子どもには自分の記録だけ）
  function strip(o) { var x = {}; for (var k in o) { if (k.charAt(0) !== '_') x[k] = o[k]; } return x; }
  function view(st, role) {
    var isKid = KIDS.indexOf(role) >= 0;
    var out = { role: role, names: { k1: st.names.k1, k2: st.names.k2 } };
    out.chores = st.chores.filter(function (c) { return !c.deleted; }).map(strip);
    out.wallet = (st.wallet || []).filter(function (w) { return !w.deleted && (!isKid || w.kid === role); }).map(strip);
    if (isKid) {
      out.records = st.records.filter(function (r) { return r.kid === role && r.status !== 'cancelled'; }).map(strip);
      out.requests = st.requests.filter(function (q) {
        return (q.status === 'open' && (q.mode === 'hayai' || q.to === role)) || (q.status === 'taken' && q.to === role);
      }).map(strip);
    } else {
      out.records = st.records.filter(function (r) { return r.status !== 'cancelled'; }).map(strip);
      out.requests = st.requests.filter(function (q) { return q.status === 'open' || q.status === 'taken' || q.status === 'submitted'; }).map(strip);
    }
    return out;
  }

  return { apply: apply, view: view, balance: balance, waitingWithdraw: waitingWithdraw, walletBalance: walletBalance, walletDelBreaks: walletDelBreaks, maegariDelBreaks: maegariDelBreaks, toInt: toInt, cleanText: cleanText,
    MAX_YEN: MAX_YEN, NAME_MAX: NAME_MAX, CHORE_MAX: CHORE_MAX, MEMO_MAX: MEMO_MAX, CATS: CATS, MAEGARI: MAEGARI };
})();
/* ==== CORE:END ==== */
</script>

/* ===== 動き方を決める =====

 * demo … 試作。ダミーのデータで、上の帯で3つの画面を切り替える（?demo か、手元で開いたとき）
 * nokey … 合言葉なしで公開URLを開いたとき */

const LSKEY = 'otetsudai.k';

try{ if(!KEY && !LOCAL && !Q.has('demo')) KEY = localStorage.getItem(LSKEY) || ''; }catch(e){}
const MODE = KEY && GAS_URL ? 'live' : (Q.has('demo') || LOCAL ? 'demo' : 'nokey');
if(MODE==='demo') document.title += '（試作）';

    else localStorage.setItem(LSKEY,KEY);
  }catch(e){}
}
function forget(){ try{ if(localStorage.getItem(LSKEY)===KEY) localStorage.removeItem(LSKEY); }catch(e){} }

};

function seed(){

    chores:[

      {id:'b02',kid:'k2',type:'chore',name:'せんたくものを たたむ',yen:50,tip:0,status:'approved',at:at(29,18,30)},
      {id:'b03',kid:'k2',type:'withdraw',yen:40,status:'approved',at:at(25,15,0)},
      {id:'a1',kid:'k1',type:'chore',name:'へやの そうじき',yen:50,tip:0,status:'approved',at:at(4,17,0)},

function when(ts, kid){

  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===now.toDateString()) return (kid?'きょう ':'今日 ')+hm;
  if(d.toDateString()===y.toDateString()) return (kid?'きのう ':'昨日 ')+hm;
  return (d.getMonth()+1)+'/'+d.getDate();
}

function api(a,p){
  if(MODE==='demo'){
    try{ CORE.apply(S, view(), a, p||{}, Date.now(), newId); }
    catch(e){ if(e&&e.code) return Promise.resolve({ok:false,err:e.code,extra:e.extra}); return Promise.reject(e); }
    [S.chores,S.records,S.requests,S.wallet||[]].forEach(l=>l.forEach(o=>{delete o._new;delete o._dirty}));
    return Promise.resolve({ok:true});
  }
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 20000);
  return fetch(GAS_URL,{method:'POST',body:JSON.stringify(Object.assign({},p||{},{k:KEY,a:a})),signal:ctl.signal})
    .then(r=>r.json()).finally(()=>clearTimeout(timer));
}
function errMsg(code, extra){
  const kid = view()!=='mama';
  const can = extra && extra.can!=null ? extra.can : null;
  const M = {
    taken:['ほかの こが さきに おしたよ','もう他の子が「やる！」を押していました'],
    gone:['もう かわって いたよ。がめんを みてね','もう変わっていました（取り消された・処理済みなど）'],
    balance:[can!=null?`ひきだせるのは ${yen(can)}円 までだよ`:'おかねが たりないよ', can!=null?`残高が足りません（いまの残高 ${yen(can)}円）`:'残高が足りません'],
    input:['すうじで いれてね','数字で入れてください'],
    same:['','2人に別の名前をつけてください'],
    perm:['この がめんでは できないよ','この画面ではできません'],
    busy:['いま こんでいるよ。もういちど おしてね','混み合っています。もう一度押してください'],
    key:['この URLは つかえないよ','このURLは使えません'],
    saifu:[can!=null?`おさいふには ${yen(can)}円 しか ないよ。さきに 「もらった」を かいてね`:'おさいふの おかねが たりないよ','おさいふの残高が足りません'],
    saifu_del:['けすと おさいふが マイナスに なるよ。さきに 「つかった」を けしてね','消すとおさいふがマイナスになります'],
    maegari_del:['','消すとおさいふの記録の途中でマイナスになるので、消せませんでした'],
  };
  const m = M[code];
  return m ? m[kid?0:1] : (kid?'うまく いかなかったよ。もういちど おしてね':'うまくいきませんでした。もう一度押してください');
}
let BUSY=false, LOADING=null, PENDING=null;
let LASTERR=null;   // いちばん最後に act が失敗した理由（GAS の err。届かなかったときは 'net'）
const sheetOpen = () => $('#sbg').classList.contains('show');
const typing = () => { const ae=document.activeElement; return !!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && $('#app').contains(ae)); };
// 操作を送って、帰ってきたデータで描き直す。opts.wait はハンコを押す関数（送ると決まってから押す）
function act(a, p, okMsg, opts){
  opts = opts||{};
  const kid = view()!=='mama';
  if(BUSY){ LASTERR='wait'; toast(kid?'まってね。いま おくっているよ':'少し待ってください（送っている途中です）'); return Promise.resolve(false); }
  BUSY=true; LASTERR=null;
  const wait = typeof opts.wait==='function' ? opts.wait() : null;
  const before = LOADING || Promise.resolve();   // 裏の読み込み中なら、それが終わってから送る（黙って捨てない）
  const slow = MODE==='live' ? setTimeout(()=>toast(kid?'おくっています…':'送っています…',true),350) : null;
  return before.then(()=>Promise.all([api(a,p), wait])).then(([res])=>{
    PENDING=null;
    if(res && res.state){ if(MODE==='live') remember(res.state); setState(res.state); }
    if(!res || !res.ok){
      if(res && res.err==='key'){ KEYBAD=true; forget(); hideToast(); render(); return false; }
      LASTERR=(res&&res.err)||'server'; render(); toast(errMsg(res&&res.err, res&&res.extra)); return false;
    }
    render(); if(okMsg) toast(typeof okMsg==='function'?okMsg():okMsg); else if(slow) hideToast();
    return true;
  }).catch(()=>{
    LASTERR='net';
    // 返事が届かなくても、GAS では保存できていることがある。すぐ読み込み直して画面を合わせる
    render();
    toast(kid?'おくれたか わからないよ。すこし まって がめんを みてね':'送れたか分かりません。少し待って画面を確かめてください');
    BUSY=false; bgLoad();
    return false;
  }).finally(()=>{ BUSY=false; clearTimeout(slow); flushPending(); });
}
// 裏の読み込み（45秒ごと・画面に戻ったとき）。押した操作は止めない。入力中・操作中は描き直さずにとっておく
function bgLoad(){
  if(MODE!=='live'||KEYBAD) return Promise.resolve(false);
  if(LOADING) return LOADING;
  LOADING = api('load',{}).then(res=>{
    if(res && res.err==='key'){ KEYBAD=true; forget(); render(); return false; }
    if(!res || !res.ok || !res.state) return false;
    remember(res.state);
    if(BUSY || typing() || sheetOpen()){ PENDING=res.state; return true; }
    setState(res.state); render(); return true;
  }).catch(()=>false).finally(()=>{ LOADING=null; });
  return LOADING;
}
function flushPending(){
  if(PENDING && !BUSY && !typing() && !sheetOpen()){ setState(PENDING); PENDING=null; render(); }
}
document.addEventListener('focusout',()=>setTimeout(flushPending,0));

/* ===== 月ごとの集計（ママの画面） ===== */
let MONTH=null;   // 見ている月 "2026-10"。null ＝ 今月
const ym = ts => {const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ymLabel = m => {const [y,mo]=m.split('-');return `${y}年${Number(mo)}月`};
function monthSum(kid,m){
  let got=0,tip=0,out=0,end=0;
  S.records.filter(r=>r.kid===kid&&r.status==='approved').forEach(r=>{
    const rm=ym(doneAt(r));
    const v = r.type==='withdraw' ? -r.yen : r.yen+(r.tip||0);
    if(rm<=m) end+=v;                       // 月末の残高＝その月の終わりまでの合計
    if(rm===m){ if(r.type==='withdraw') out+=r.yen; else {got+=r.yen+(r.tip||0);tip+=r.tip||0} }
  });
  return {got,tip,out,end};
}
function monthHTML(){
  const now=ym(Date.now());
  const first=S.records.filter(r=>r.status==='approved').map(r=>ym(doneAt(r))).sort()[0]||now;
  const ms=[]; let [y,mo]=first.split('-').map(Number);
  for(;;){const k=y+'-'+String(mo).padStart(2,'0'); ms.push(k); if(k>=now) break; if(++mo>12){mo=1;y++}}
  const m = MONTH && ms.includes(MONTH) ? MONTH : now;
  const i=ms.indexOf(m), prev=ms[i-1], next=ms[i+1];
  const rows=Object.keys(KIDS).map(k=>({k,...monthSum(k,m)}));
  const cell=r=>`<span><b class="num">${yen(r.got)}円</b>${r.tip?`<small>うちチップ ${yen(r.tip)}円</small>`:''}</span>
    <span><b class="num${r.out?' minus':''}">${r.out?'−':''}${yen(r.out)}円</b></span>
    <span><b class="num">${yen(r.end)}円</b></span>`;
  return `<div class="mnav">
      <button data-act="mprev" ${prev?`data-m="${prev}"`:'disabled'}>前の月</button>
      <b>${ymLabel(m)}</b>
      <button data-act="mnext" ${next?`data-m="${next}"`:'disabled'}>次の月</button></div>
    <div class="sum">
      <div class="sr head"><span>もらった</span><span>引き出した</span><span>${m===now?'いまの残高':'月末の残高'}</span></div>
      ${rows.map(r=>`<div class="sr" style="${kv(r.k)}"><span class="kn">${esc(KIDS[r.k].name)}</span>${cell(r)}</div>`).join('')}
    </div>`;
}

/* ===== おさいふ（ママの画面・見るだけ） ===== */
let SMONTH=null;  // 見ている月。null ＝ 今月
function saifuMamaHTML(){
  if(!hasSaifu()) return '';
  const ks=Object.keys(KIDS);
  const zan = ks.map(k=>`<div class="zr" style="${kv(k)}"><span class="kn">${esc(KIDS[k].name)}</span><span class="num">${yen(walletBalance(k))}<small>円</small></span></div>`).join('');
  const all = ks.flatMap(k=>saifuRows(k).map(e=>Object.assign({kid:k},e)));
  const now=ym(Date.now());
  const first=all.map(e=>ym(e.at)).sort()[0]||now;
  const ms=[]; let [y,mo]=first.split('-').map(Number);
  for(;;){const k=y+'-'+String(mo).padStart(2,'0'); ms.push(k); if(k>=now) break; if(++mo>12){mo=1;y++}}
  const m = SMONTH && ms.includes(SMONTH) ? SMONTH : now;
  const i=ms.indexOf(m), prev=ms[i-1], next=ms[i+1];
  const sum = l => l.reduce((s,e)=>s+e.yen,0);
  const per = ks.map(k=>{
    const es=all.filter(e=>e.kid===k&&ym(e.at)===m);
    const outs=es.filter(e=>e.kind==='out');
    return {k, es, inn:sum(es.filter(e=>e.kind!=='out')), out:sum(outs),
      cats:CORE.CATS.map(c=>[c,sum(outs.filter(e=>e.cat===c))]).filter(x=>x[1]>0)};
  });
  const max=Math.max(0,...per.flatMap(p=>p.cats.map(x=>x[1])));   // 2人とも同じものさしで棒を描く
  const what = e => e.kind==='hiki' ? (e.mae ? '前借り（ママが渡した）' : '引き出し（ママが渡した）') : e.kind==='in' ? 'もらった' : esc(e.cat);
  const cards = per.map(p=>`<div class="sk" style="${kv(p.k)}">
      <div class="skh"><span class="kn">${esc(KIDS[p.k].name)}</span><span class="io">入った <b class="num">${yen(p.inn)}円</b></span><span class="io">使った <b class="num${p.out?' minus':''}">${p.out?'−':''}${yen(p.out)}円</b></span></div>
      ${p.cats.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><span class="bt"><i style="width:${Math.max(3,Math.round(v/max*100))}%"></i></span><span class="num">${yen(v)}円</span></div>`).join('')||'<p class="zero">この月に使った記録はありません</p>'}
      ${p.es.slice().reverse().map(e=>`<div class="hrow"><div class="tx">${what(e)}<span class="sub">${md(e.at)}${e.memo?`「${esc(e.memo)}」`:''}</span></div><span class="m num${e.kind==='out'?' minus':''}">${e.kind==='out'?'−':'＋'}${yen(e.yen)}円</span></div>`).join('')}
    </div>`).join('');
  return `<div class="blk"><h2>おさいふ（子どもの手元のお金）</h2><p class="note">子どもが自分で書くお小遣い帳です（ママは見るだけ）。引き出しを「渡した」にすると自動で入ります</p>
    <div class="zan">${zan}</div>
    <h3>月ごとの使いみち</h3>
    <div class="mnav">
      <button data-act="smonth" ${prev?`data-m="${prev}"`:'disabled'}>前の月</button>
      <b>${ymLabel(m)}</b>
      <button data-act="smonth" ${next?`data-m="${next}"`:'disabled'}>次の月</button></div>
    ${cards}</div>`;
}

let qrLib=null;
function drawQR(){
  if(!document.querySelector('.qr[data-qr]')) return;
  if(!qrLib) qrLib=new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.integrity='sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==';s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.onload=ok;s.onerror=ng;document.head.appendChild(s)});
  qrLib.then(()=>{
    document.querySelectorAll('.qr[data-qr]').forEach(el=>{
      if(el.firstChild) return;
      const q=qrcode(0,'M'); q.addData(el.dataset.qr); q.make();
      el.innerHTML=q.createSvgTag(4,2);
    });
  }).catch(()=>{qrLib=null;document.querySelectorAll('.qr').forEach(el=>el.textContent='QRが出せませんでした。下のURLをコピーして使ってください')});
}
let QRSHOW=null;   // いまQRを出している人（1人ずつ）

/* ===== 子どもの動き ===== */
// 「やったよ」は一覧からでも付箋からでも、かならず確認を1回はさむ（2回たたいても送られない）
// その子の付箋のうち、同じお手伝いの物（自分が「やる！」した物 → 自分あて → 早い者勝ち の順。同じなら古い物から）
function reqFor(kid,name){
  const rank=q=>q.status==='taken'?0:q.mode==='shimei'?1:2;
  return S.requests.filter(q=>q.name===name &&
      ((q.status==='open'&&(q.mode==='hayai'||q.to===kid)) || (q.status==='taken'&&q.to===kid)))
    .sort((a,b)=>rank(a)-rank(b)||a.at-b.at)[0]||null;
}
// 付箋の分として送る。早い者勝ちで まだ誰も押していなければ、先に「やる！」をしてから送る
function sendReq(kid,q){
  const send = q.status==='open'&&q.mode==='hayai'
    ? act('take',{qid:q.id},null).then(ok=>ok&&act('reqdone',{qid:q.id},'ママに おくったよ'))
    : act('reqdone',{qid:q.id},'ママに おくったよ');
  return send.then(ok=>{
    if(ok) return true;
    // 付箋がもう押せなければ、自分の分は まだ届いていないことを はっきり言う（押し直せば ふつうの「やったよ」になる）
    // 理由は GAS の返事で分ける：taken＝ほかの子が取った／gone＝ママが取り消した・もう済んだ。混んでいた・届かなかったときは いつもの言葉のまま
    if(LASTERR==='taken'||LASTERR==='gone')
      toast((LASTERR==='taken'?'ほかの こが さきに やることに なったよ。':'この おねがいは もう なくなったよ。')+'もういちど 「やったよ」を おしてね',false,5000);
    return false;
  });
}

    <button class="sbtn main" id="sOk">やったよ！ ママに おくる</button>
    <button class="sbtn sub" id="sNo">まだ やってない</button>`,kid);
  $('#sNo').onclick=closeSheet;
  $('#sOk').onclick=()=>{closeSheet();send()};
}

    const x=e.target.closest('[data-c]'); if(!x) return;
    cat=x.dataset.c;
    $('#sCat').querySelectorAll('button').forEach(o=>{o.classList.toggle('on',o===x);o.setAttribute('aria-pressed',o===x)});
    $('#sErr').textContent='';
  };
  $('#sNo').onclick=closeSheet;
  $('#sOk').onclick=()=>{
    const t=toNum($('#sAmt').value), n=t.n, err=m=>{$('#sErr').textContent=m};
    if(out&&!cat) return err('なにに つかったか えらんでね');
    if(t.bad) return err('すうじで いれてね');
    if(n<=0) return err('きんがくを いれてね');
    if(n>CORE.MAX_YEN) return err('きんがくが おおきすぎるよ');
    if(out&&n>b) return err(`おさいふには ${yen(b)}円 しか ないよ。もらった おかねが あったら さきに 「もらった」を かいてね`);
    const memo=$('#sMemo').value;
    closeSheet();
    act(out?'saifu_out':'saifu_in',{yen:String(n),cat:cat||'',memo},out?'おさいふの きろくに かいたよ':'おさいふに いれたよ');
  };
}
function kidSaifuDel(kid,id){
  const e=(S.wallet||[]).find(w=>w.id===id&&w.kid===kid); if(!e) return render();
  const name=e.type==='in'?'もらった':e.cat;
  if(CORE.walletDelBreaks(S,kid,e)){   // 消すと きろくの途中で のこりがマイナスになる
    openSheet(`<h3>${esc(name)} ${yen(e.yen)}円 は いま けせないよ</h3><p class="lead warn">けすと おさいふが マイナスに なるよ。さきに 「つかった」の きろくを けしてね</p>
      <button class="sbtn sub" id="sNo">とじる</button>`,kid);
    $('#sNo').onclick=closeSheet;
    return;
  }
  openSheet(`<h3>この きろくを けす？</h3><p class="lead">${md(e.at)}　${esc(name)}${e.memo?`（${esc(e.memo)}）`:''}　<b>${yen(e.yen)}円</b></p>
    <button class="sbtn main" id="sOk">けす</button>
    <button class="sbtn sub" id="sNo">けさない</button>`,kid);
  $('#sNo').onclick=closeSheet;
  $('#sOk').onclick=()=>{closeSheet();act('saifu_del',{wid:id},'けしたよ')};
}

/* ===== ママの動き ===== */
function mamaAsk(){
  let pick=null, who=null;
  const draw=()=>{
    const list=chores().map(c=>`<button class="${pick===c.id?'on':''}" data-c="${esc(c.id)}"><span class="dot"></span>${esc(c.name)}<span class="y num">${yen(c.yen)}円</span></button>`).join('');
    const ws=[['k1',`${KIDS.k1.name}に頼む`,''],['k2',`${KIDS.k2.name}に頼む`,''],['both','2人に出す（早い者勝ち）','先に「やる！」を押した子のお手伝いになる']]
      .map(([v,l,s])=>`<button class="${who===v?'on':''}" data-w="${v}"><span class="dot"></span><span>${esc(l)}${s?`<small>${s}</small>`:''}</span></button>`).join('');
    openSheet(`<h3>お願いを書く</h3><p class="lead">子どもの画面のいちばん上に付箋で出ます</p>
      <span class="sl">何を頼む？</span><div class="pick" id="pc">${list}</div>
      <span class="sl">誰に？</span><div class="pick" id="pw">${ws}</div>
      <button class="sbtn main" id="sOk" ${pick&&who?'':'disabled'}>${pick&&who?'送る':'何を・誰にを選ぶと送れます'}</button>
      <button class="sbtn sub" id="sNo">やめる</button>`);
    $('#pc').onclick=e=>{const b=e.target.closest('[data-c]');if(b){pick=b.dataset.c;keep(draw)}};
    $('#pw').onclick=e=>{const b=e.target.closest('[data-w]');if(b){who=b.dataset.w;keep(draw)}};
    $('#sNo').onclick=closeSheet;
    $('#sOk').onclick=()=>{
      if(!pick||!who) return;
      const w=who; closeSheet();
      act('ask',{cid:pick,who:w}, ()=>w==='both'?'2人に送りました':`${KIDS[w].name}に送りました`);
    };
  };
  draw();
}
// 前借りを記録する：誰に・いくら → ちょきんから引く（マイナスになってもよい）
function mamaMaegari(){
  let who=null, amt='';
  const read=()=>{const t=toNum(amt);return {t, ok:!!who&&!t.bad&&!t.empty&&t.n>0&&t.n<=CORE.MAX_YEN}};
  const upd=()=>{
    const {t,ok}=read();
    $('#mErr').textContent = t.bad ? '数字で入れてください' : t.n>CORE.MAX_YEN ? `1回 ${yen(CORE.MAX_YEN)}円までです` : '';
    $('#mCalc').textContent = ok ? `${KIDS[who].name}のちょきん ${yen(balance(who))}円 → ${yen(balance(who)-t.n)}円` : '';
    const b=$('#sOk'); b.disabled=!ok;
    b.textContent = ok ? `${KIDS[who].name}に ${yen(t.n)}円 前借りを記録` : '誰に・いくらを入れると記録できます';
  };
  const draw=()=>{
    const ws=Object.keys(KIDS).map(k=>`<button class="${who===k?'on':''}" data-w="${k}"><span class="dot"></span>${esc(KIDS[k].name)}<span class="y num">いま ${yen(balance(k))}円</span></button>`).join('');
    openSheet(`<h3>前借りを記録する</h3><p class="lead">渡したお金を、その子のちょきんから引きます。足りないときはマイナスになって、次のお手伝いのぶんで戻ります</p>
      <span class="sl">誰に渡した？</span><div class="pick" id="pw">${ws}</div>
      <label class="sl" for="mAmt">いくら渡した？</label>
      <div class="amtrow"><input id="mAmt" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${esc(amt)}"><span>円</span></div>
      <p class="scalc" id="mCalc"></p>
      <p class="err" id="mErr" role="alert"></p>
      <button class="sbtn main" id="sOk" disabled>誰に・いくらを入れると記録できます</button>
      <button class="sbtn sub" id="sNo">やめる</button>`);
    $('#pw').onclick=e=>{const b=e.target.closest('[data-w]');if(b){who=b.dataset.w;keep(draw)}};
    $('#mAmt').oninput=e=>{amt=e.target.value;upd()};
    $('#sNo').onclick=closeSheet;
    $('#sOk').onclick=()=>{
      const {t,ok}=read(); if(!ok) return;
      const w=who, n=t.n; closeSheet();
      act('maegari',{kid:w,yen:String(n)},`${KIDS[w].name}に ${yen(n)}円の前借りを記録しました`);
    };
    upd();
  };
  draw();
}
// 前借りの書きまちがいを消す
function mamaMaegariDel(r){
  const name=KIDS[r.kid].name, b=balance(r.kid);
  if(CORE.maegariDelBreaks(S,r)){
    openSheet(`<h3>${esc(name)}の前借り ${yen(r.yen)}円は いま消せません</h3><p class="lead warn">消すと、おさいふの記録の途中でマイナスになります。このあとに${esc(name)}が書いた「つかった」を先に消してもらうと、消せるようになります。前借りを正しい金額で記録し直したら、${esc(name)}に「つかった」をもう一度書いてもらってください</p>
      <button class="sbtn sub" id="sNo">閉じる</button>`);
    $('#sNo').onclick=closeSheet; return;
  }
  openSheet(`<h3>${esc(name)}の前借り ${yen(r.yen)}円を消す？</h3><p class="lead">書きまちがえたときに使います。消すと、ちょきんは ${yen(b)}円 → ${yen(b+r.yen)}円 に戻ります</p>
    <button class="sbtn main" id="sOk">消す</button>
    <button class="sbtn sub" id="sNo">やめる</button>`);
  $('#sNo').onclick=closeSheet;
  $('#sOk').onclick=()=>{closeSheet();act('maegari_del',{rid:r.id},'前借りの記録を消しました')};
}
// 選び直してもシートのスクロール位置を保つ
function keep(fn){const y=$('#sheet').scrollTop;fn();$('#sheet').scrollTop=y}

$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id, v=view();
  const rec=S&&S.records.find(r=>r.id===id), q=S&&S.requests.find(x=>x.id===id);
  switch(a){
    case 'retry': return init();
    case 'qr': QRSHOW = QRSHOW===b.dataset.k ? null : b.dataset.k; render(); return;
    case 'chore':{
      const c=chores().find(x=>x.id===id); if(!c) return;
      const q=reqFor(v,c.name);   // 同じお手伝いの付箋があれば付箋の分として届ける（一覧から押しても付箋が残らないように）
      if(q) return confirmDone(v,q.name,q.yen,()=>sendReq(v,q));
      return confirmDone(v,c.name,c.yen,()=>act('done',{cid:id},'ママに おくったよ'));}
    case 'withdraw': return kidWithdraw(v);
    case 'sout': return kidSaifu(v,'out');
    case 'sin': return kidSaifu(v,'in');
    case 'sdel': return kidSaifuDel(v,id);
    case 'smonth': SMONTH=b.dataset.m;render();return;
    case 'take': return act('take',{qid:id},'あなたの おてつだいに なったよ');
    case 'untake':
      if(!q) return render();
      openSheet(`<h3>${esc(q.name)}の 「やる！」を とりけす？</h3><p class="lead">とりけすと、また ふたりとも 「やる！」を おせるように なるよ</p>
        <button class="sbtn main" id="sOk">とりけす</button>
        <button class="sbtn sub" id="sNo">やっぱり やる</button>`,v);
      $('#sNo').onclick=closeSheet;
      $('#sOk').onclick=()=>{closeSheet();act('untake',{qid:id},'とりけしたよ。また ふたりとも おせるよ')};
      return;
    case 'reqdone':
      if(!q) return render();
      return confirmDone(v,q.name,q.yen,()=>act('reqdone',{qid:id},'ママに おくったよ'));
    case 'again': return act('again',{rid:id},'ママに おくったよ');
    case 'cancel': return act('cancel',{rid:id},'とりけしたよ');
    case 'ok':{
      if(!rec) return render();
      const t=toNum(TIP[id]);
      if(t.bad){toast('チップは数字で入れてください');return}
      const name=KIDS[rec.kid].name, amount=rec.yen+t.n, tip=t.n;
      return act('ok',{rid:id,tip:String(tip)},`${name}に ${yen(amount)}円あげました${tip?`（チップ${yen(tip)}円込み）`:''}`,{wait:()=>stamp(id)})
        .then(ok=>{if(ok) delete TIP[id]});}
    case 'redo':{
      if(!rec) return render();
      const name=KIDS[rec.kid].name;
      return act('redo',{rid:id},`${name}にやり直しを頼みました`).then(ok=>{if(ok){delete TIP[id];render()}});}
    case 'wok':{
      if(!rec) return render();
      const name=KIDS[rec.kid].name, n=rec.yen;
      return act('wok',{rid:id},`渡しました。${name}の残高から${yen(n)}円引きました`,{wait:()=>stamp(id)});}
    case 'wno': return act('wno',{rid:id},'引き出しをやめにしました');
    case 'ask': return mamaAsk();
    case 'maegari': return mamaMaegari();
    case 'mdel':{
      if(!rec) return render();
      return mamaMaegariDel(rec);}
    case 'reqcancel': return act('reqcancel',{qid:id},'お願いを取り消しました');
    case 'cdel': return act('chore_del',{cid:id},'消しました');
    case 'cadd': return act('chore_add',{name:'新しいお手伝い',yen:'10'},null).then(ok=>{
      if(!ok) return; const ins=document.querySelectorAll('#dEdit .en'); const last=ins[ins.length-1]; if(last){last.focus();last.select()}});
    case 'names':{
      const vs={}; document.querySelectorAll('.kname').forEach(i=>vs[i.dataset.kid]=i.value.trim().slice(0,CORE.NAME_MAX));
      if(!vs.k1||!vs.k2){toast('名前を入れてください');return}
      if(vs.k1===vs.k2){toast('2人に別の名前をつけてください');return}
      return act('names',vs,'名前を変えました').then(ok=>{if(ok){delete NAMEDRAFT.k1;delete NAMEDRAFT.k2;render()}});}
    case 'mprev': case 'mnext': MONTH=b.dataset.m;render();return;
    case 'copy':{
      const u=b.dataset.url;
      const done=()=>toast('コピーしました');
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done,()=>toast('コピーできませんでした。URLを長押ししてコピーしてください'));
      else{const i=b.previousElementSibling;i.select();try{document.execCommand('copy');done()}catch(err){toast('URLを長押ししてコピーしてください')}}
      return;}
  }
});
// チップを入れたら OK ボタンの金額も変わる
$('#app').addEventListener('input',e=>{
  if(e.target.classList.contains('kname')){ NAMEDRAFT[e.target.dataset.kid]=e.target.value; return; }
  if(!e.target.classList.contains('tipin')) return;
  const r=S.records.find(x=>x.id===e.target.dataset.id); if(!r) return;
  TIP[r.id]=e.target.value;
  e.target.closest('.pend').querySelector('.ok').outerHTML=okBtn(r);
});
// お手伝いと金額の編集（欄から外れたときに送る）
$('#app').addEventListener('change',e=>{
  if(e.target.dataset.kid) return;   // 名前は「この名前にする」で決める（打っている途中で描き直さない）
  const cid=e.target.dataset.cid; if(!cid) return;
  const c=chores().find(x=>x.id===cid); if(!c) return;
  if(e.target.dataset.f==='name'){
    const n=e.target.value.trim(); if(!n||n===c.name){render();return}
    act('chore_edit',{cid,name:n},'直しました');
  }else{
    const t=toNum(e.target.value);
    if(t.bad||t.empty){toast('金額は数字で入れてください');render();return}
    if(t.n===c.yen) return;
    act('chore_edit',{cid,yen:String(t.n)},'直しました');
  }
});
$('#reset').addEventListener('click',()=>{S=seed();MONTH=null;SMONTH=null;[TIP,NAMEDRAFT].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));closeSheet();render();toast('最初に戻しました')});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b) go(b.dataset.v)});
addEventListener('hashchange',()=>{const v=location.hash.slice(1); if(v!==CUR) go(v)});

/* ===== 本番：ときどき読み込み直す（ほかのスマホでの変化を映す） ===== */
function refresh(){
  if(MODE!=='live'||KEYBAD) return;
  if(!S){ if(LOADFAIL) init(); return; }
  bgLoad();
}
setInterval(()=>{ if(document.visibilityState==='visible') refresh() }, 45000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh() });
addEventListener('pageshow',e=>{ if(e.persisted) refresh() });

function init(){
  LOADFAIL=false; render();
  if(MODE!=='live') return;
  const t0=Date.now();
  api('load',{}).then(res=>{
    if(res && res.err==='key'){ KEYBAD=true; forget(); return; }
    if(!res || !res.ok || !res.state) throw new Error('load');
    remember(res.state); setState(res.state); FAILS=0;
  }).catch(()=>{ LOADFAIL=true; FAILS++; })
    .then(()=>setTimeout(render, Math.max(0, 600-(Date.now()-t0))));   // 押したのが分かるよう「よみこみちゅう」を少し見せる
}
init();
</script>
</body>
</html>
